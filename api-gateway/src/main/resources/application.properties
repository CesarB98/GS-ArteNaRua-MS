spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rotas dinamicas: /<nome-do-servico-no-eureka>/** -> lb://<nome-do-servico>
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Rotas explicitas (balanceadas pelo Load Balancer via Eureka, sem URL fixa)
spring.cloud.gateway.server.webflux.routes[0].id=ms-obras
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-obras
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/obras/**,/api/v1/artistas/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-contribuicoes
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-contribuicoes
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/contribuicoes/**
